[build-system]
requires = ["setuptools>=69,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "zhou2021-adqc"
version = "0.1.0"
description = "Convention-explicit independent reproduction of Zhou, Hong and Ran (2021) ADQC."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4,<10",
]
dev = [
  "pytest>=7.4,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
]
plot = [
  "matplotlib>=3.7,<4",
]
mps = [
  "physics-tenpy>=1.1,<2",
]
noise = [
  "qiskit>=2.2,<3",
  "qiskit-aer>=0.17,<0.18",
  "qiskit-ibm-runtime>=0.45,<0.49",
]

[project.scripts]
zhou2021 = "zhou2021.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
xfail_strict = true
markers = [
  "slow: paper-scale or high-bond-dimension numerical checks",
  "regression: fixed-reference reproduction checks",
  "qiskit: tests requiring the optional Qiskit noise stack",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["zhou2021"]

[tool.coverage.report]
show_missing = true
skip_covered = false
